[package]
name = "glu-meeting-ai"
version = "0.1.0"
description = "Glu — AI Meeting Assistant Desktop App"
authors = ["Francisco Espinoza"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
tauri-plugin-global-shortcut = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15" # Captura de audio multiplataforma (ScreenCaptureKit / WASAPI)
hound = "3.5" # Grabación en formato WAV sin pérdidas
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
rusqlite = { version = "0.31", features = ["bundled"] }
log = "0.4"
env_logger = "0.11"
